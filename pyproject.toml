[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens"
dynamic = ["version"]
description = "Find leaked secrets (tokens, keys, passwords) in source code and git history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maxim Gaints" }]
keywords = ["security", "secrets", "secret-scanner", "git", "pre-commit", "sarif", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/m4ks1em-maker/leaklens"
Issues = "https://github.com/m4ks1em-maker/leaklens/issues"

[project.scripts]
leaklens = "leaklens.cli:main"

[tool.setuptools.dynamic]
version = { attr = "leaklens.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
